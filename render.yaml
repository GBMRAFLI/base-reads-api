services:
  - type: web
    name: base-reads-x402
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: HOST=0.0.0.0 python api/index.py
    envVars:
      - key: PAY_TO_ADDRESS   # public receive-only payee wallet (code default is the same address)
        value: "0x427F423908233DbCA2C51e4c6AE36D18f821641c"
      - key: SIGNING_KEY_PASSPHRASE   # encrypts the Ed25519 signing key at rest; set in dashboard only
        sync: false
      - key: SNAPSHOT_SCHEDULER       # 1 = daily Bazaar snapshot runs in-process (00:15 UTC + at boot if missing)
        value: "1"
      - key: SIGNING_KEY_ENC_B64      # encrypted Ed25519 key (base64 PEM); keeps the public key stable across restarts
        sync: false
      - key: CDP_API_KEY_ID           # optional: only used when FACILITATOR is the CDP facilitator
        sync: false
      - key: CDP_API_KEY_SECRET       # optional: base64 Ed25519 key from the CDP portal
        sync: false
      - key: EXPORT_TOKEN             # bearer token for GET /internal/export (an external collector pulls hourly)
        sync: false
      - key: SNAPSHOT_DIR             # free tier: ephemeral; rebuilt at boot if missing
        value: /tmp/snapshots
      - key: DATA_STORE            # free tier: ephemeral buffer; an external collector pulls hourly, on-chain logs are the source of truth
        value: /tmp/records
      - key: SELF_WALLETS           # optional: extra own wallets excluded from external-buyer counts
        sync: false
